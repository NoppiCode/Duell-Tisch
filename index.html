<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b1640">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Duell-Tisch</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0d0b1f;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:#fff;touch-action:none;overscroll-behavior:none}
#c{position:fixed;inset:0;display:block;touch-action:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(16px,env(safe-area-inset-bottom))}
.scr.show{display:flex}
#menu{background:radial-gradient(circle at 50% 45%,rgba(13,11,31,.15),rgba(13,11,31,.7))}
.logo{font-size:min(15vw,64px);font-weight:900;line-height:.95;text-align:center;letter-spacing:1px;margin-bottom:6px;filter:drop-shadow(0 5px 0 rgba(0,0,0,.35))}
.logo span{display:block}
.logo .l1{color:#4fa3ff;transform:rotate(-4deg)}
.logo .l2{color:#ff5d73;transform:rotate(3deg)}
.logo .vs{font-size:.35em;color:#ffd65a;margin:2px 0}
.pill{background:rgba(0,0,0,.5);border:2px solid rgba(255,214,90,.7);border-radius:999px;padding:6px 16px;font-size:20px;font-weight:bold;color:#ffd65a;white-space:nowrap}
.big{width:min(320px,86vw);padding:12px 18px;border-radius:22px;font-size:22px;font-weight:bold;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;transition:transform .08s,box-shadow .08s;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.big small{font-size:13px;font-weight:normal;opacity:.95}
.b1{background:linear-gradient(#5aaaff,#2f6fd6)}.b2{background:linear-gradient(#ff7388,#d63c56)}.b3{background:linear-gradient(#5ade86,#2a9d55)}.b4{background:linear-gradient(#ffbe55,#e0811c)}.b5{background:linear-gradient(#a57bff,#6a3fd6)}
.row{display:flex;gap:12px;margin-top:4px}
.ico{width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,.45);font-size:24px;border:2px solid rgba(255,255,255,.25)}
.panel{background:rgba(13,11,31,.92);justify-content:flex-start}
.hdr{width:100%;max-width:760px;display:flex;align-items:center;gap:10px}
.hdr h2{flex:1;margin:0;font-size:24px}
.back{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.12);font-size:26px}
.scroll{overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;width:100%;max-width:760px;flex:1}
.diff{display:flex;gap:8px;align-items:center;font-size:16px;flex-wrap:wrap;justify-content:center}
.diff button{padding:8px 14px;border-radius:14px;background:rgba(255,255,255,.12);font-weight:bold}
.diff button.on{background:#ffd65a;color:#3a2a00}
.glist{display:flex;flex-direction:column;gap:12px;align-items:center;padding:6px 0 20px}
.gcard{width:min(420px,92vw);display:flex;align-items:center;gap:14px;padding:14px;border-radius:20px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.15);text-align:left;box-shadow:0 5px 0 rgba(0,0,0,.3)}
.gcard:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.3)}
.gcard .gi{font-size:40px;width:56px;text-align:center}
.gcard b{font-size:20px;display:block}
.gcard span{font-size:14px;opacity:.85}
.gcard em{font-style:normal;font-size:13px;color:#ffd65a;display:block;margin-top:3px}
.tabs{display:flex;gap:8px;overflow-x:auto;touch-action:pan-x;width:100%;max-width:760px;padding:4px 2px 8px;flex-shrink:0}
.tabs button{flex-shrink:0;padding:8px 12px;border-radius:14px;background:rgba(255,255,255,.1);font-weight:bold;font-size:15px;white-space:nowrap}
.tabs button.on{background:#ffd65a;color:#3a2a00}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:4px 2px 24px}
.card{background:rgba(255,255,255,.08);border:3px solid rgba(255,255,255,.08);border-radius:18px;padding:8px;display:flex;flex-direction:column;gap:6px;align-items:stretch}
.card.eq{border-color:#ffd65a}
.card canvas{width:100%;aspect-ratio:150/110;border-radius:12px;background:#000;display:block}
.card .nm{font-weight:bold;font-size:15px;text-align:center}
.card .act{display:flex;gap:6px}
.card .act button{flex:1;padding:8px 4px;border-radius:12px;font-weight:bold;font-size:14px;background:rgba(255,255,255,.15)}
.card .act button.buy{background:linear-gradient(#ffbe55,#e0811c)}
.card .act button.buy.no{background:rgba(255,255,255,.12);color:#bbb}
.card .act button.on{background:#ffd65a;color:#3a2a00}
.card .act button.p1.on{background:#4fa3ff;color:#fff}
.card .act button.p2.on{background:#ff5d73;color:#fff}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.dim{background:rgba(5,4,15,.72)}
#endScr{padding:0;gap:0;background:rgba(5,4,15,.86)}
.half{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;width:100%;padding:10px}
.half.top{transform:rotate(180deg)}
.half .t1{font-size:min(10vw,44px);font-weight:900;text-shadow:0 4px 0 rgba(0,0,0,.4)}
.half .t2{font-size:18px;margin-top:6px;opacity:.9}
.mid{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px}
.mid .big{width:auto;min-width:130px;font-size:19px}
#endStars{width:100%;text-align:center;font-size:22px;font-weight:bold;color:#ffd65a}
#pauseBtn{position:fixed;left:8px;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.3);font-size:20px;display:none;z-index:5}
#toast{position:fixed;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-120px);background:#ffd65a;color:#3a2a00;font-weight:bold;padding:10px 18px;border-radius:16px;transition:transform .35s;z-index:20;box-shadow:0 5px 0 rgba(0,0,0,.3);font-size:17px;white-space:nowrap}
#toast.show{transform:translateX(-50%) translateY(0)}
.hint{font-size:13px;opacity:.7;text-align:center;max-width:420px}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="menu" class="scr show">
  <div class="logo"><span class="l1">Duell</span><span class="vs">⚡ ⚡ ⚡</span><span class="l2">Tisch</span></div>
  <div class="pill">⭐ <b class="coinV">0</b></div>
  <button class="big b1" data-mode="solo">🧒 1 Spieler<small>Sterne sammeln</small></button>
  <button class="big b2" data-mode="vs">⚔️ 2 Spieler<small>gegeneinander</small></button>
  <button class="big b3" data-mode="coop">🤝 2 Spieler<small>zusammen</small></button>
  <button class="big b4" id="shopBtn">🛍️ Shop<small>Sterne ausgeben</small></button>
  <div class="row"><button class="ico" id="sndBtn" aria-label="Ton">🔊</button><button class="ico" id="fsBtn" aria-label="Vollbild">⛶</button></div>
</div>

<div id="pick" class="scr panel">
  <div class="hdr"><button class="back" aria-label="Zurück">←</button><h2 id="pickTitle"></h2><div class="pill">⭐ <b class="coinV">0</b></div></div>
  <div id="diffRow" class="diff">🤖 Roboter: <button data-d="0">Leicht</button><button data-d="1">Mittel</button><button data-d="2">Schwer</button></div>
  <div id="pickHint" class="hint"></div>
  <div class="scroll"><div id="gameList" class="glist"></div></div>
</div>

<div id="shop" class="scr panel">
  <div class="hdr"><button class="back" aria-label="Zurück">←</button><h2>🛍️ Shop</h2><div class="pill">⭐ <b class="coinV">0</b></div></div>
  <div class="tabs" id="tabs"></div>
  <div class="scroll"><div class="grid" id="grid"></div></div>
</div>

<div id="pauseScr" class="scr dim">
  <button class="big b3" id="resumeBtn">▶ Weiter</button>
  <button class="big b2" id="quitBtn">🏠 Menü</button>
</div>

<div id="endScr" class="scr dim">
  <div class="half top"><div class="t1" id="endTop"></div><div class="t2" id="endTop2"></div></div>
  <div id="endStars"></div>
  <div class="mid"><button class="big b3" id="againBtn">🔁 Nochmal</button><button class="big b1" id="menuBtn">🏠 Menü</button></div>
  <div class="half"><div class="t1" id="endBot"></div><div class="t2" id="endBot2"></div></div>
</div>

<button id="pauseBtn" aria-label="Pause">⏸</button>
<div id="toast"></div>

<script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const WW=100, WH=175, CY=WH/2, GX0=32, GX1=68, PI=Math.PI, TAU=PI*2;
const C1='#4fa3ff', C2='#ff5d73';
const clamp=(v,a,b)=>v<a?a:v>b?b:v, rnd=(a,b)=>a+Math.random()*(b-a);
function rng(s){return()=>(s=(s*16807)%2147483647)/2147483647;}

/* ================= Speicher ================= */
const SAVE_KEY='duelltisch_v1';
let save={coins:0,owned:{skin:['blau','rot'],table:['eis'],ball:['puck'],light:['normal'],trail:['keine'],cheer:['konfetti'],sound:['klassik']},
  eq:{skin1:'blau',skin2:'rot',table:'eis',ball:'puck',light:'normal',trail:'keine',cheer:'konfetti',sound:'klassik'},best:{},sound:true,cpu:0,day:''};
try{const s=JSON.parse(localStorage.getItem(SAVE_KEY));if(s){for(const k in s){if(k==='owned'||k==='eq')Object.assign(save[k],s[k]);else save[k]=s[k];}}}catch(e){}
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}updateCoins();}
function updateCoins(){$$('.coinV').forEach(e=>e.textContent=save.coins);}

/* ================= Zeichen-Helfer ================= */
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();}
function starPath(c,R,r,n=5,rot=-PI/2){c.beginPath();for(let i=0;i<n*2;i++){const a=rot+i*PI/n,q=i%2?r:R;i?c.lineTo(Math.cos(a)*q,Math.sin(a)*q):c.moveTo(Math.cos(a)*q,Math.sin(a)*q);}c.closePath();}
function heartPath(c,s){c.beginPath();c.moveTo(0,s*.35);c.bezierCurveTo(-s*1.1,-s*.3,-s*.5,-s*1.05,0,-s*.45);c.bezierCurveTo(s*.5,-s*1.05,s*1.1,-s*.3,0,s*.35);c.closePath();}
function circ(c,x,y,r,col){c.fillStyle=col;c.beginPath();c.arc(x,y,r,0,TAU);c.fill();}
function txt(c,s,x,y,size,col,flip,stroke=true,align='center'){c.save();c.translate(x,y);if(flip)c.rotate(PI);c.font=`900 ${size}px "Trebuchet MS",system-ui,sans-serif`;c.textAlign=align;c.textBaseline='middle';if(stroke){c.lineWidth=size*.22;c.strokeStyle='rgba(0,0,0,.55)';c.lineJoin='round';c.strokeText(s,0,0);}c.fillStyle=col;c.fillText(s,0,0);c.restore();}

/* ================= Tische ================= */
const TABLES={
 eis:{name:'Eisfläche',price:0,l1:'#e04a5f',l2:'#e04a5f',l3:'#3d7be0',frame:'#2b4c7e',draw(c){const g=c.createLinearGradient(0,0,0,WH);g.addColorStop(0,'#d3eeff');g.addColorStop(.5,'#f4fbff');g.addColorStop(1,'#d3eeff');c.fillStyle=g;c.fillRect(0,0,WW,WH);const r=rng(7);c.strokeStyle='rgba(120,180,220,.4)';c.lineWidth=.3;for(let i=0;i<45;i++){const x=r()*WW,y=r()*WH,a=r()*6.3,l=4+r()*14;c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x+Math.cos(a)*l*.5+2,y+Math.sin(a)*l*.5,x+Math.cos(a)*l,y+Math.sin(a)*l);c.stroke();}}},
 holz:{name:'Holztisch',price:40,l1:'#fff3dc',l2:'#ff6b5b',l3:'#4aa3ff',frame:'#5b3416',draw(c){const r=rng(3);for(let i=0;i<8;i++){c.fillStyle=`hsl(${25+r()*8},${45+r()*10}%,${46+r()*10}%)`;c.fillRect(i*12.5,0,12.6,WH);c.fillStyle='rgba(60,30,10,.4)';c.fillRect(i*12.5,0,.4,WH);c.strokeStyle='rgba(90,50,20,.22)';c.lineWidth=.35;for(let k=0;k<5;k++){const ox=i*12.5+2+r()*8.5;c.beginPath();c.moveTo(ox,0);for(let y=0;y<=WH;y+=5)c.lineTo(ox+Math.sin(y*.08+k+i)*1.2,y);c.stroke();}const ky=r()*WH;c.beginPath();c.ellipse(i*12.5+6,ky,1.6,3,0,0,TAU);c.stroke();}}},
 wiese:{name:'Blumenwiese',price:60,l1:'#ffffff',l2:'#ffffff',l3:'#ffffff',frame:'#2e6b30',draw(c){for(let i=0;i<14;i++){c.fillStyle=i%2?'#5dbb5a':'#52ad4f';c.fillRect(0,i*12.5,WW,12.6);}const r=rng(11);c.strokeStyle='rgba(30,90,30,.55)';c.lineWidth=.35;for(let i=0;i<50;i++){const x=r()*WW,y=r()*WH;c.beginPath();c.moveTo(x,y);c.lineTo(x-.8,y-2);c.moveTo(x,y);c.lineTo(x+.8,y-2.2);c.stroke();}for(let i=0;i<16;i++){const x=r()*WW,y=r()*WH,col=['#fff','#ffe14d','#ff8ad1'][i%3];for(let k=0;k<5;k++)circ(c,x+Math.cos(k*1.256)*.9,y+Math.sin(k*1.256)*.9,.7,col);circ(c,x,y,.5,'#ffb000');}}},
 weltraum:{name:'Weltraum',price:90,l1:'#6ff3ff',l2:'#ff7ad9',l3:'#6ff3ff',frame:'#2a2470',draw(c){const g=c.createRadialGradient(50,CY,10,50,CY,110);g.addColorStop(0,'#2a1d6e');g.addColorStop(1,'#07061a');c.fillStyle=g;c.fillRect(0,0,WW,WH);const r=rng(5);for(let i=0;i<3;i++){const x=r()*WW,y=r()*WH,rad=20+r()*25,n=c.createRadialGradient(x,y,0,x,y,rad);n.addColorStop(0,['rgba(255,80,200,.28)','rgba(80,160,255,.28)','rgba(140,90,255,.28)'][i]);n.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=n;c.fillRect(0,0,WW,WH);}for(let i=0;i<150;i++)circ(c,r()*WW,r()*WH,r()*.45+.1,`rgba(255,255,255,${.3+r()*.7})`);circ(c,86,30,7,'#ff9a5a');circ(c,84,28,2,'rgba(120,40,20,.35)');c.strokeStyle='#ffd9a8';c.lineWidth=.8;c.beginPath();c.ellipse(86,30,12,3,-.3,0,TAU);c.stroke();circ(c,14,WH-34,4.5,'#7fd0ff');circ(c,13,WH-35.5,1.4,'rgba(255,255,255,.5)');}},
 meer:{name:'Unterwasser',price:90,l1:'#e8fbff',l2:'#ff8a8a',l3:'#ffe27a',frame:'#0b3d63',draw(c){const g=c.createLinearGradient(0,0,0,WH);g.addColorStop(0,'#0d6ea8');g.addColorStop(.5,'#29b6d8');g.addColorStop(1,'#0d6ea8');c.fillStyle=g;c.fillRect(0,0,WW,WH);c.fillStyle='rgba(255,255,255,.07)';for(let i=0;i<6;i++){c.beginPath();c.moveTo(10+i*22,0);c.lineTo(22+i*22,0);c.lineTo(i*22-20,WH);c.lineTo(i*22-34,WH);c.closePath();c.fill();}const r=rng(9);c.lineCap='round';for(const side of [0,1])for(let k=0;k<4;k++){const bx=side?WW-2-r()*5:2+r()*5,by=20+k*40+r()*10;c.strokeStyle=['#2fbf71','#1f9e5a'][k%2];c.lineWidth=1.4;c.beginPath();c.moveTo(bx,by+14);for(let s=0;s<=14;s+=2)c.lineTo(bx+Math.sin(s*.5+k)*1.8*(side?-1:1),by+14-s);c.stroke();}c.strokeStyle='rgba(255,255,255,.55)';c.lineWidth=.3;for(let i=0;i<30;i++){c.beginPath();c.arc(r()*WW,r()*WH,.4+r()*1.4,0,TAU);c.stroke();}for(let i=0;i<4;i++){const x=15+r()*70,y=15+r()*145,s=r()<.5?1:-1;c.fillStyle=['#ffb347','#ff6f91','#ffe066','#9b8cff'][i];c.beginPath();c.ellipse(x,y,3,1.8,0,0,TAU);c.fill();c.beginPath();c.moveTo(x-2.5*s,y);c.lineTo(x-5*s,y-1.6);c.lineTo(x-5*s,y+1.6);c.fill();circ(c,x+1.6*s,y-.4,.35,'#002');}}},
 lava:{name:'Vulkan',price:120,l1:'#ffb347',l2:'#ff5a3c',l3:'#ffd23c',frame:'#140b0b',draw(c){c.fillStyle='#2b1d1d';c.fillRect(0,0,WW,WH);const r=rng(13);for(let i=0;i<30;i++)circ(c,r()*WW,r()*WH,3+r()*8,`rgba(${60+r()*30|0},${40+r()*20|0},40,.6)`);c.lineJoin='round';c.lineCap='round';for(let i=0;i<9;i++){let x=r()*WW,y=r()*WH;const pts=[[x,y]];for(let k=0;k<6;k++){x+=(r()-.5)*16;y+=(r()-.5)*16;pts.push([x,y]);}for(const [w,col] of [[2.6,'rgba(255,80,0,.3)'],[1.1,'#ff7a1a'],[.4,'#ffe08a']]){c.strokeStyle=col;c.lineWidth=w;c.beginPath();pts.forEach((p,j)=>j?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.stroke();}}}},
 suess:{name:'Zuckerland',price:140,l1:'#ffffff',l2:'#ff4f8b',l3:'#4fc3ff',frame:'#e05597',draw(c){c.fillStyle='#ffd3e6';c.fillRect(0,0,WW,WH);const r=rng(21);for(let i=0;i<10;i++)circ(c,r()*WW,r()*WH,5+r()*8,'rgba(255,255,255,.35)');const cols=['#ff4f8b','#4fc3ff','#ffd23f','#7ee081','#b57bff','#ffffff'];for(let i=0;i<170;i++){const x=r()*WW,y=r()*WH,a=r()*3.14;c.save();c.translate(x,y);c.rotate(a);c.fillStyle=cols[i%6];c.fillRect(-1,-.3,2,.6);c.restore();}for(const [x,y] of [[10,12],[90,WH-12]])for(let k=0;k<4;k++)circ(c,x,y,5-k*1.2,k%2?'#fff':'#ff4f8b');}},
 nacht:{name:'Nachtstadt',price:160,l1:'#ffe066',l2:'#ff5d73',l3:'#4fa3ff',frame:'#101028',draw(c){const g=c.createLinearGradient(0,0,0,WH);g.addColorStop(0,'#141a3d');g.addColorStop(.5,'#2b2160');g.addColorStop(1,'#141a3d');c.fillStyle=g;c.fillRect(0,0,WW,WH);const r=rng(17);for(const top of [0,1]){let x=0;while(x<WW){const w=6+r()*9,h=10+r()*22;const y=top?0:WH-h;c.fillStyle=`hsl(${235+r()*20},30%,${12+r()*8}%)`;c.fillRect(x,y,w,h);for(let wx=x+1.2;wx<x+w-1.5;wx+=2.4)for(let wy=(top?y+1.5:y+1.5);wy<y+h-1.5;wy+=3)if(r()<.45){c.fillStyle=r()<.8?'#ffd86b':'#7fd6ff';c.fillRect(wx,wy,1.2,1.5);}x+=w+.6;}}for(let i=0;i<40;i++)circ(c,r()*WW,35+r()*105,r()*.35+.1,'rgba(255,255,255,.7)');circ(c,78,CY-26,5,'#fff5c4');circ(c,80,CY-27,4.4,'#2b2160');}}
};
function fieldMarks(c,T){c.save();c.lineWidth=.9;c.globalAlpha=.9;c.strokeStyle=T.l1;c.beginPath();c.moveTo(0,CY);c.lineTo(WW,CY);c.stroke();c.beginPath();c.arc(50,CY,14,0,TAU);c.stroke();circ(c,50,CY,1.6,T.l1);c.strokeStyle=T.l2;c.beginPath();c.arc(50,0,20,0,PI);c.stroke();c.strokeStyle=T.l3;c.beginPath();c.arc(50,WH,20,PI,TAU);c.stroke();c.restore();}

function updParts(arr,dt){for(let i=arr.length-1;i>=0;i--){const p=arr[i];p.life-=dt;p.vx*=Math.pow(p.drag,dt);p.vy*=Math.pow(p.drag,dt);p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;if(p.t==='rocket'&&p.life<=0){for(let k=0;k<34;k++){const a=k/34*TAU,s=rnd(25,55);spawn(arr,{t:'spark',x:p.x,y:p.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,drag:.25,life:1.3,max:1.3,size:rnd(.6,1.1),col:p.col});}}if(p.life<=0)arr.splice(i,1);}}
function drawParts(c,arr,t){for(const p of arr){const k=clamp(p.life/p.max,0,1);c.save();c.translate(p.x,p.y);c.globalAlpha=Math.min(1,k*2);switch(p.t){
 case 'conf':c.rotate(p.rot);c.fillStyle=p.col;c.fillRect(-p.size,-p.size*.45,p.size*2,p.size*.9);break;
 case 'spark':circ(c,0,0,p.size*k+.2,p.col);break;
 case 'rocket':circ(c,0,0,.9,'#fff');circ(c,-p.vx*.02,-p.vy*.02,.6,p.col);break;
 case 'heart':c.scale(p.size,p.size);c.rotate(Math.sin(t*3+p.x)*.3);c.fillStyle=p.col;heartPath(c,1.4);c.fill();break;
 case 'balloon':c.translate(Math.sin(t*2+p.x)*1.5,0);c.strokeStyle='rgba(255,255,255,.7)';c.lineWidth=.25;c.beginPath();c.moveTo(0,p.size*1.25*p.dir);c.quadraticCurveTo(1,p.size*2*p.dir,0,p.size*3*p.dir);c.stroke();c.fillStyle=p.col;c.beginPath();c.ellipse(0,0,p.size,p.size*1.25,0,0,TAU);c.fill();circ(c,-p.size*.35,-p.size*.4*p.dir,p.size*.25,'rgba(255,255,255,.5)');break;
 case 'star':c.rotate(p.rot);c.fillStyle=p.col;starPath(c,p.size,p.size*.45);c.fill();break;
 case 'ring':c.globalAlpha=k;c.strokeStyle=p.col;c.lineWidth=.8;c.beginPath();c.arc(0,0,p.size*(1-k)+1,0,TAU);c.stroke();break;
 case 'text':if(p.flip)c.rotate(PI);c.globalAlpha=Math.min(1,k*1.5);txt(c,p.s,0,0,p.size,p.col,false);break;
 }c.restore();}}

const PR=8.5;

function movePad(p,dt,maxSp){p.ox=p.x;p.oy=p.y;const R=p.R;p.tx=clamp(p.tx,R,WW-R);p.ty=p.i?clamp(p.ty,R,CY-R*.5):clamp(p.ty,CY+R*.5,WH-R);let dx=p.tx-p.x,dy=p.ty-p.y;const d=Math.hypot(dx,dy),m=maxSp*dt;if(d>m){dx*=m/d;dy*=m/d;}p.x+=dx;p.y+=dy;p.vx=dx/dt;p.vy=dy/dt;}
function lookAt(p,balls){let best=null,bd=1e9;for(const b of balls){if(b.hidden)continue;const d=Math.hypot(b.x-p.x,b.y-p.y);if(d<bd){bd=d;best=b;}}if(best)p.look=Math.atan2(best.y-p.y,best.x-p.x);}
function physics(g,dt,o){const N=6,h=dt/N;
 for(let s=1;s<=N;s++){const f=s/N;for(const p of g.pads){p.cx=p.ox+(p.x-p.ox)*f;p.cy=p.oy+(p.y-p.oy)*f;}
  for(const b of g.balls){if(b.hidden||b.out)continue;b.x+=b.vx*h;b.y+=b.vy*h;
   if(b.x<b.r){b.x=b.r;if(b.vx<0){b.vx=-b.vx*.92;g.onWall&&g.onWall(b);}}
   if(b.x>WW-b.r){b.x=WW-b.r;if(b.vx>0){b.vx=-b.vx*.92;g.onWall&&g.onWall(b);}}
   for(const end of [0,1]){const kind=end?o.bot:o.top,yE=end?WH:0;const pen=end?b.y+b.r-WH:b.r-b.y;
    const wall=()=>{if(pen>0){b.y=end?WH-b.r:b.r;if(end?b.vy>0:b.vy<0){b.vy=-b.vy*.92;g.onWall&&g.onWall(b);}}};
    if(kind==='wall')wall();
    else if(kind==='goal'){if(b.x<=GX0||b.x>=GX1)wall();else{for(const px of [GX0,GX1]){const dx=b.x-px,dy=b.y-yE,d=Math.hypot(dx,dy);if(d<b.r&&d>1e-4){const nx=dx/d,ny=dy/d;b.x=px+nx*b.r;b.y=yE+ny*b.r;const vn=b.vx*nx+b.vy*ny;if(vn<0){b.vx-=1.85*vn*nx;b.vy-=1.85*vn*ny;g.onWall&&g.onWall(b);}}}if(end?b.y>WH:b.y<0)b.x=clamp(b.x,GX0+b.r*.6,GX1-b.r*.6);if(end?b.y>WH+b.r:b.y<-b.r)b.out=end?2:1;}}
    else if(kind==='open'){if(end?b.y>WH+b.r:b.y<-b.r)b.out=end?2:1;}}
   for(const p of g.pads){const dx=b.x-p.cx,dy=b.y-p.cy,d=Math.hypot(dx,dy),md=p.R+b.r;if(d<md){let nx,ny;if(d<1e-4){nx=0;ny=p.i?1:-1;}else{nx=dx/d;ny=dy/d;}b.x=p.cx+nx*md;b.y=p.cy+ny*md;const rvx=b.vx-p.vx,rvy=b.vy-p.vy,vn=rvx*nx+rvy*ny;if(vn<0){b.vx-=1.9*vn*nx;b.vy-=1.9*vn*ny;g.onHit&&g.onHit(b,p,-vn);}}}}
  if(g.balls.length>1)for(let i=0;i<g.balls.length;i++)for(let j=i+1;j<g.balls.length;j++){const a=g.balls[i],b=g.balls[j];if(a.hidden||b.hidden||a.out||b.out)continue;const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),md=a.r+b.r;if(d<md&&d>1e-4){const nx=dx/d,ny=dy/d,ov=(md-d)/2;a.x-=nx*ov;a.y-=ny*ov;b.x+=nx*ov;b.y+=ny*ov;const vn=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(vn<0){a.vx+=vn*nx;a.vy+=vn*ny;b.vx-=vn*nx;b.vy-=vn*ny;}}}}
 for(const b of g.balls){const sp=Math.hypot(b.vx,b.vy),mx=o.max||230;if(sp>mx){b.vx*=mx/sp;b.vy*=mx/sp;}const fr=Math.pow(o.fric==null?.8:o.fric,dt);b.vx*=fr;b.vy*=fr;b.spin+=(b.vx+b.vy*.5)*dt*.06;b.cd-=dt;}}

   const sp=Math.hypot(b.vx,b.vy);if(sp<minS){const k=1+(minS/Math.max(sp,1)-1)*Math.min(1,dt*2.5);b.vx*=k;b.vy*=k;if(sp<1){b.vy=minS*(b.y<CY?1:-1);} }

  if(Math.abs(g.pos)>=1){const w=g.pos>0?0:1;g.pos=w?-1:1;g.score[w]++;sfx('point');buzz(80);cheerAt(50,w?6:WH-6,w?1:-1);spawn(parts,{t:'text',s:w===0?'Runde für Blau!':'Runde für Rot!',x:50,y:w?CY-30:CY+30,flip:w===1,life:1.4,max:1.4,size:7,col:w?C2:C1});

const SYMS=[['circle','#ff4f6d'],['square','#4fa3ff'],['tri','#4fd27a'],['heart','#ff7eb6'],['circle','#ffd23f'],['star','#4fa3ff'],['star','#c0c6d6'],['square','#b57bff'],['tri','#ff9a3c']];
function drawSym(c,s,x,y,R,t){c.save();c.translate(x,y);c.fillStyle=s[1];if(s[0]==='circle'){c.beginPath();c.arc(0,0,R*.8,0,TAU);c.fill();}else if(s[0]==='square'){rr(c,-R*.72,-R*.72,R*1.44,R*1.44,R*.2);c.fill();}else if(s[0]==='tri'){c.beginPath();c.moveTo(0,-R*.85);c.lineTo(R*.85,R*.65);c.lineTo(-R*.85,R*.65);c.closePath();c.fill();}else if(s[0]==='heart'){c.scale(R*.75,R*.75);heartPath(c,1.25);c.fill();}else if(s[0]==='star'){c.rotate(t*.5);starPath(c,R,R*.45);c.fill();if(s[2]){c.strokeStyle='#fff8c4';c.lineWidth=.8;c.stroke();}}c.restore();}
function Snap(mode){const g=base(mode);const coop=mode==='coop';g.need=5;g.hearts=3;g.team=0;g.lock=[0,0];g.tapped=[false,false];g.cpuAt=-1;g.pop=0;g.since=0;g.cur=SYMS[0];g.isStar=false;g.claimed=false;g.timer=1;

  if(star){g.since=0;g.cur=['star','#ffcc1f',1];g.timer=coop?Math.max(.95,1.7-g.team*.05):1.5;if(g.mode==='solo'&&Math.random()>.1)g.cpuAt=DIFF[save.cpu].snap+rnd(-.08,.15);}
  else{g.since++;let s;do{s=SYMS[Math.floor(Math.random()*SYMS.length)];}while(s===g.cur);g.cur=s;g.timer=rnd(.55,1.15)*(coop?Math.max(.6,1-g.team*.02):1);}};

  if(g.isStar&&!g.claimed){if(coop){if(!g.tapped[o]){g.tapped[o]=true;sfx('tap');spawn(parts,{t:'ring',x:50,y:o?CY-30:CY+30,life:.4,max:.4,size:8,col:o?C2:C1});if(g.tapped[0]&&g.tapped[1]){g.claimed=true;g.team++;sfx('point');cheerAt(50,CY,0);g.timer=Math.min(g.timer,.5);}}}
   else{g.claimed=true;g.score[o]++;sfx('point');buzz(40);cheerAt(50,o?CY-22:CY+22,o?-1:1);spawn(parts,{t:'text',s:'Schnapp!',x:50,y:o?CY-36:CY+36,flip:o===1,life:1,max:1,size:9,col:o?C2:C1});if(o===0)earn(g,2*DIFF[save.cpu].m,30,CY+44);g.timer=.7;
    if(g.score[o]>=g.need){if(g.mode==='solo'&&o===0)earn(g,10*DIFF[save.cpu].m,50,CY+54);finish(g,o);}}}
  else if(!g.isStar){g.lock[o]=1;sfx('bad');buzz(100);spawn(parts,{t:'text',s:'Zu früh!',x:50,y:o?CY-36:CY+36,flip:o===1,life:1,max:1,size:8,col:'#ff8080'});}};
 g.down=(o,x,y)=>{if(g.phase!=='play')return;if(o===1&&g.mode==='solo')return;tap(o);};
 g.update=dt=>{g.lock[0]=Math.max(0,g.lock[0]-dt);g.lock[1]=Math.max(0,g.lock[1]-dt);g.pop=Math.max(0,g.pop-dt*5);
  if(g.cpuAt>=0){g.cpuAt-=dt;if(g.cpuAt<0){g.cpuAt=-1;tap(1);if(g.phase!=='play')return;}}

 g.draw=c=>{for(const o of [0,1])if(g.lock[o]>0){c.fillStyle=`rgba(255,40,60,${g.lock[o]*.35})`;c.fillRect(0,o?0:CY,WW,CY);}
  const R=15*(1+g.pop*.25);circ(c,50,CY,22,'rgba(0,0,0,.35)');c.strokeStyle=g.isStar?'#ffd23f':'rgba(255,255,255,.8)';c.lineWidth=1.4;c.beginPath();c.arc(50,CY,22,0,TAU);c.stroke();
  if(g.isStar&&!g.claimed){c.save();c.translate(50,CY);c.rotate(T*1.5);c.fillStyle='rgba(255,220,80,.25)';for(let i=0;i<8;i++){c.rotate(TAU/8);c.beginPath();c.moveTo(0,0);c.lineTo(-4,34);c.lineTo(4,34);c.fill();}c.restore();}
  drawSym(c,g.cur,50,CY,R,T);
  if(coop)for(const o of [0,1])if(g.tapped[o])txt(c,'✔',50,o?CY-30:CY+30,9,o?C2:C1,o===1);
  const a=.75;c.globalAlpha=a;txt(c,'Tippe nur beim goldenen ⭐',50,WH-22,5.2,'#fff',false);if(g.mode!=='solo')txt(c,'Tippe nur beim goldenen ⭐',50,22,5.2,'#fff',true);c.globalAlpha=1;
  drawPad(c,save.eq.skin1,50,WH-9,6,T,-PI/2,false);drawPad(c,g.mode==='solo'?'robo':save.eq.skin2,50,9,6,T,PI/2,true);};
 g.hud=c=>{if(coop){drawHearts(c,g.hearts,3);txt(c,'⭐ '+g.team,88,CY+30,6.5,'#ffd65a',false);txt(c,'⭐ '+g.team,12,CY-30,6.5,'#ffd65a',true);}else{txt(c,String(g.score[0]),90,CY+30,11,C1,false);txt(c,String(g.score[1]),10,CY-30,11,C2,true);if(g.mode==='solo')txt(c,'⭐ '+g.earned,13,CY+30,6,'#ffd65a',false);}};
 next();return g;}

$('#shopBtn').onclick=()=>{sfx('click');openShop();};
const sndBtn=$('#sndBtn');const sndUpd=()=>sndBtn.textContent=save.sound?'🔊':'🔇';sndUpd();
sndBtn.onclick=()=>{save.sound=!save.sound;persist();sndUpd();sfx('click');};
$('#fsBtn').onclick=()=>{const d=document;try{if(!d.fullscreenElement){(d.documentElement.requestFullscreen||d.documentElement.webkitRequestFullscreen).call(d.documentElement).then(()=>{try{screen.orientation.lock('portrait').catch(()=>{});}catch(e){}}).catch(()=>{});}else d.exitFullscreen();}catch(e){}};
$('#pauseBtn').onclick=()=>{if(!game)return;paused=true;sfx('click');show('pauseScr');};
$('#resumeBtn').onclick=()=>{paused=false;show(null);};
$('#quitBtn').onclick=()=>{game=null;paused=false;parts=[];openPick(curMode);};
$('#againBtn').onclick=()=>{sfx('click');startGame(curId,curMode);};
$('#menuBtn').onclick=()=>{sfx('click');game=null;parts=[];openPick(curMode);};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&game&&game.phase==='play'&&!paused){paused=true;show('pauseScr');}});

/* ================= Shop ================= */
let shopOpen=false,shopCat='skin';const previews=[];
function openShop(){buildTabs();buildGrid();show('shop');}
function buildTabs(){const tb=$('#tabs');tb.innerHTML='';CATS.forEach(c=>{const b=document.createElement('button');b.textContent=c.i+' '+c.name;b.classList.toggle('on',c.id===shopCat);b.onclick=()=>{shopCat=c.id;sfx('click');buildTabs();buildGrid();};tb.appendChild(b);});}
function isEq(cat,id){if(cat==='skin')return save.eq.skin1===id||save.eq.skin2===id;return save.eq[cat]===id;}
function buildGrid(){const gr=$('#grid');gr.innerHTML='';previews.length=0;const cat=CATS.find(c=>c.id===shopCat);
 Object.entries(cat.items).filter(([id,it])=>!it.hidden).sort((a,b)=>a[1].price-b[1].price).forEach(([id,it])=>{
  const owned=save.owned[cat.id].includes(id),card=document.createElement('div');card.className='card'+(isEq(cat.id,id)?' eq':'');
  const pc=document.createElement('canvas');const dpr=Math.min(devicePixelRatio||1,2);pc.width=150*dpr;pc.height=110*dpr;card.appendChild(pc);previews.push({cv:pc,c:pc.getContext('2d'),cat:cat.id,id,dpr,parts:[],t:Math.random()*5,ball:{x:50,y:CY,r:4.5,spin:0,vx:0,vy:0,hist:[]},nt:0});
  const nm=document.createElement('div');nm.className='nm';nm.textContent=it.name;card.appendChild(nm);
  const act=document.createElement('div');act.className='act';card.appendChild(act);
  if(!owned){const b=document.createElement('button');b.className='buy'+(save.coins<it.price?' no':'');b.textContent='⭐ '+it.price;b.onclick=()=>{if(save.coins<it.price){card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake');sfx('bad');toast('Dir fehlen noch '+(it.price-save.coins)+' ⭐');return;}save.coins-=it.price;save.owned[cat.id].push(id);if(cat.id==='skin')save.eq.skin1=id;else save.eq[cat.id]=id;persist();sfx('buy');toast('🎉 '+it.name+' gehört jetzt dir!');buildGrid();};act.appendChild(b);}
  else if(cat.id==='skin'){for(const [k,l] of [['skin1','Blau'],['skin2','Rot']]){const b=document.createElement('button');b.className=(k==='skin1'?'p1':'p2')+(save.eq[k]===id?' on':'');b.textContent=l;b.onclick=()=>{save.eq[k]=id;persist();sfx('click');buildGrid();};act.appendChild(b);}}
  else{const b=document.createElement('button');const on=save.eq[cat.id]===id;b.className=on?'on':'';b.textContent=on?'✔ Aktiv':'Auswählen';b.onclick=()=>{save.eq[cat.id]=id;persist();if(cat.id==='sound')sfx('goal');else sfx('click');buildGrid();};act.appendChild(b);}
  if(cat.id==='sound')pc.onclick=()=>{const old=save.eq.sound;save.eq.sound=id;sfx('goal');save.eq.sound=old;};
  if(cat.id==='cheer')pc.onclick=()=>{const p=previews.find(p=>p.cv===pc);if(p)CHEERS[id].fire(p.parts,50,CY+18,-1);};
  gr.appendChild(card);});}
function renderPreviews(dt){for(const p of previews){if(!p.cv.isConnected)continue;const r=p.cv.getBoundingClientRect();if(r.bottom<0||r.top>innerHeight)continue;p.t+=dt;const c=p.c,t=p.t,pw=150*p.dpr,ph=110*p.dpr;c.setTransform(1,0,0,1,0,0);c.fillStyle='#0d0b1f';c.fillRect(0,0,pw,ph);
  let s=1.6;if(p.cat==='skin')s=4;else if(p.cat==='ball')s=7;else if(p.cat==='table')s=110/181;
  const k=s*p.dpr;c.setTransform(k,0,0,k,pw/2-50*k,ph/2-CY*k);
  const tbl=p.cat==='table'?p.id:save.eq.table;blitBoard(c,tbl,k);
  const b=p.ball;if(p.cat==='trail'){b.x=50+Math.sin(t*2.2)*22;b.y=CY+Math.sin(t*4.4)*12;}else if(p.cat==='ball'){b.x=50+Math.sin(t*1.2)*1.5;b.y=CY+Math.cos(t*1.2)*1.5;}else{b.x=50+Math.cos(t*1.8)*15;b.y=CY+Math.sin(t*1.8)*15;}
  b.vx=(b.x-(b.px??b.x))/Math.max(dt,.001);b.vy=(b.y-(b.py??b.y))/Math.max(dt,.001);b.px=b.x;b.py=b.y;b.spin+=dt*3;if(p.cat==='trail'){b.hist=[];for(let i=21;i>=1;i--){const tt=t-i*.035;b.hist.push({x:50+Math.sin(tt*2.2)*22,y:CY+Math.sin(tt*4.4)*12});}}else pushHist(b);
  const pads=[{x:28,y:CY+20,R:PR,i:0},{x:72,y:CY-20,R:PR,i:1}];
  if(p.cat==='skin'){drawPad(c,p.id,50,CY,PR,t,Math.atan2(Math.sin(t*1.5)*20,Math.cos(t*1.1)*20),false);}
  else if(p.cat==='sound'){for(let i=0;i<3;i++){const x=30+i*20,y=CY+Math.sin(t*4+i*1.5)*6;txt(c,['♪','♫','♬'][i],x,y,14,['#ffd65a','#ff7eb6','#4fa3ff'][i],false);}}
  else{if(p.cat!=='ball'&&p.cat!=='trail')pads.forEach(q=>drawPad(c,q.i?save.eq.skin2:save.eq.skin1,q.x,q.y,q.R,t,Math.atan2(b.y-q.y,b.x-q.x),q.i===1));
   const tr=p.cat==='trail'?p.id:(p.cat==='ball'?'keine':save.eq.trail);(TRAILS[tr]||TRAILS.keine).draw(c,b.hist,b.r,t);drawBall(c,p.cat==='ball'?p.id:save.eq.ball,b,t);}
  if(p.cat==='cheer'){p.nt-=dt;if(p.nt<=0){p.nt=2.4;CHEERS[p.id].fire(p.parts,50,CY+18,-1);}updParts(p.parts,dt);drawParts(c,p.parts,t);}
    if(p.cat==='light')(LIGHTS[p.id]).draw(c,t,{balls:[b],pads,px:k});}}

let toastT=null;function toast(s){const e=$('#toast');e.textContent=s;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),2000);}

/* ================= Start ================= */
(function daily(){const d=new Date().toISOString().slice(0,10);if(save.day!==d){const first=!save.day;save.day=d;save.coins+=first?20:10;persist();setTimeout(()=>toast(first?'Willkommen! 🎁 +20 ⭐ Startgeschenk':'🎁 Tagesbonus: +10 ⭐'),600);}})();
updateCoins();
requestAnimationFrame(frame);
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
</script>
